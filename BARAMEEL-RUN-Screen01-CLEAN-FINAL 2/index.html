<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b2633">
<title>BARAMEEL RUN</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;background:#0b2633;overflow:hidden}
  body{font-family:Arial,Helvetica,sans-serif;touch-action:manipulation}
  .stage{
    position:fixed;inset:0;
    display:flex;align-items:center;justify-content:center;
    background:#0b2633;
  }
  .art{
    position:relative;
    width:min(100vw,56.25vh);
    height:min(100vh,177.7778vw);
    aspect-ratio:9/16;
    background:#0b2633 url("./assets/screen01-approved.png") center/100% 100% no-repeat;
    overflow:hidden;
  }
  .hotspot{
    position:absolute;
    border:0;background:transparent;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  /* Start button area in the approved artwork */
  #start{
    left:8%; right:8%; top:76%; height:10.5%;
  }
  /* HOW IT WORKS? area */
  #how{
    left:27%; right:27%; top:87%; height:7%;
  }
  .toast{
    position:absolute;left:8%;right:8%;bottom:3%;
    padding:10px 14px;border-radius:999px;
    background:rgba(8,24,31,.94);color:#f8ead0;
    font-size:13px;text-align:center;letter-spacing:.5px;
    opacity:0;transform:translateY(8px);
    transition:.2s ease;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateY(0)}
  .modal{
    position:absolute;inset:0;background:rgba(5,18,24,.78);
    display:none;align-items:flex-end;justify-content:center;
    padding:5%;
  }
  .modal.open{display:flex}
  .sheet{
    width:100%;border-radius:22px 22px 10px 10px;
    background:#f6e7c9;color:#102b38;
    padding:22px 20px 24px;
    box-shadow:0 -12px 35px rgba(0,0,0,.35);
  }
  .sheet h2{margin:0 0 10px;font-size:25px}
  .sheet p{margin:7px 0;font-size:15px;line-height:1.45}
  .close{
    margin-top:15px;width:100%;padding:12px;border:0;border-radius:999px;
    background:#e3422e;color:#fff;font-weight:800;font-size:16px;
  }
  @media (min-width:700px){
    .art{height:100vh;width:56.25vh}
  }
</style>
</head>
<body>
<main class="stage">
  <section class="art" aria-label="BARAMEEL RUN Screen 01">
    <button id="start" class="hotspot" aria-label="Start your run"></button>
    <button id="how" class="hotspot" aria-label="How it works"></button>

    <div id="toast" class="toast">BARAMEEL RUN is ready.</div>

    <div id="modal" class="modal" aria-hidden="true">
      <div class="sheet">
        <h2>HOW IT WORKS?</h2>
        <p>Walk and explore the route, collect marks, and discover BARAMEEL along the way.</p>
        <p><strong>10 marks = 1 EGP</strong></p>
        <button id="close" class="close">BACK</button>
      </div>
    </div>
  </section>
</main>

<script>
const toast = document.getElementById('toast');
const modal = document.getElementById('modal');

document.getElementById('start').addEventListener('click', () => {
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1800);
});

document.getElementById('how').addEventListener('click', () => {
  modal.classList.add('open');
  modal.setAttribute('aria-hidden','false');
});

document.getElementById('close').addEventListener('click', () => {
  modal.classList.remove('open');
  modal.setAttribute('aria-hidden','true');
});

modal.addEventListener('click', (e) => {
  if(e.target === modal){
    modal.classList.remove('open');
    modal.setAttribute('aria-hidden','true');
  }
});
</script>
</body>
</html>

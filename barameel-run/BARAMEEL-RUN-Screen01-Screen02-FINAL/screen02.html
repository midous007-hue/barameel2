<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b2633">
<title>BARAMEEL RUN — HOW IT WORKS?</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#0b2633;overflow:hidden}
body{font-family:Arial,Helvetica,sans-serif;touch-action:manipulation}
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b2633}
.art{position:relative;width:min(100vw,56.25vh);height:min(100vh,177.7778vw);aspect-ratio:9/16;background:#0b2633 url("./assets/screen02-how-it-works.png") center/100% 100% no-repeat;overflow:hidden}
.hotspot{position:absolute;border:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}
#letsRun{left:14%;right:14%;top:79%;height:10.5%}
#back{left:0;right:0;top:0;height:8%;display:none}
@media (min-width:700px){.art{height:100vh;width:56.25vh}}
</style>
</head>
<body>
<main class="stage">
  <section class="art" aria-label="BARAMEEL RUN Screen 02">
    <button id="letsRun" class="hotspot" aria-label="Let's run"></button>
    <button id="back" class="hotspot" aria-label="Back to Screen 01"></button>
  </section>
</main>
<script>
document.getElementById('letsRun').addEventListener('click',()=>{
  window.location.href='./index.html';
});
</script>
</body>
</html>

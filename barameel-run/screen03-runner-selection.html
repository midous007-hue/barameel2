<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>BARAMEEL RUN — Choose Your Runner</title>
<style>
:root{--teal:#082a35;--deep:#061923;--cream:#f7ead7;--yellow:#f4bf35;--orange:#ef4a25;--red:#b82b1e;--ink:#102832}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#071722;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif}
.stage{position:relative;width:min(100vw,57.83vh);height:min(172.89vw,100vh);aspect-ratio:996/1722;overflow:hidden}
.base{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}
.hotspot{position:absolute;display:block;z-index:30;cursor:pointer;border:0;background:transparent;padding:0}
.back{left:1%;top:2%;width:19%;height:5.5%;z-index:50}

/* Character cards: only the portrait area is clickable. */
.card-hit{transition:transform .12s ease;transform-origin:center}
.card-hit.play-rookie{animation:tapRookie .62s ease}
.card-hit.play-skater{animation:tapSkater .72s cubic-bezier(.2,.8,.2,1)}
.card-hit.play-brona{animation:tapBrona .72s ease}
.card-hit.play-racer{animation:tapRacer .62s cubic-bezier(.2,.8,.2,1)}
.card-hit.play-chiller{animation:tapChiller .9s ease}
.card-hit.play-dreamer{animation:tapDreamer .9s ease}
@keyframes tapRookie{0%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-8px) scale(1.03)}55%{transform:translateY(2px) rotate(-2deg) scale(1.02)}75%{transform:rotate(2deg)}}
@keyframes tapSkater{0%{transform:translateX(0) rotate(0)}25%{transform:translateX(-9px) rotate(-3deg)}55%{transform:translateX(10px) rotate(3deg)}100%{transform:translateX(0) rotate(0)}}
@keyframes tapBrona{0%{transform:scale(1)}25%{transform:scale(1.055) rotate(-1.5deg)}50%{transform:scale(.985) rotate(1deg)}75%{transform:scale(1.035)}100%{transform:scale(1)}}
@keyframes tapRacer{0%{transform:translateX(0) skewX(0)}20%{transform:translateX(-10px) skewX(-3deg)}50%{transform:translateX(13px) skewX(3deg)}100%{transform:translateX(0) skewX(0)}}
@keyframes tapChiller{0%,100%{transform:translateY(0)}35%{transform:translateY(-7px) rotate(1deg)}70%{transform:translateY(3px) rotate(-1deg)}}
@keyframes tapDreamer{0%{transform:scale(1) rotate(0)}25%{transform:scale(1.045) rotate(2deg)}50%{transform:scale(1.02) rotate(-2deg)}75%{transform:scale(1.04) rotate(1deg)}100%{transform:scale(1) rotate(0)}}

/* Cover the baked-in name plates, then redraw them in a consistent 70s display treatment. */
.name-cover{position:absolute;z-index:20;top:34.65%;height:3.45%;background:linear-gradient(180deg,#102f3a,#071d27 82%);border-top:2px solid rgba(244,191,53,.9);border-bottom:2px solid rgba(244,191,53,.9);pointer-events:none;box-shadow:0 2px 0 rgba(0,0,0,.45)}
.name{position:absolute;z-index:31;top:35.15%;height:2.25%;display:flex;align-items:center;justify-content:center;color:#f7ead7;pointer-events:none;font-family:"Cooper Black","Arial Black",Impact,sans-serif;font-size:clamp(7px,1.45vw,14px);font-weight:900;letter-spacing:.15px;text-transform:uppercase;line-height:1;text-shadow:2px 2px 0 #071722,-1px -1px 0 #071722;white-space:nowrap;transform:skewX(-2deg)}
{% for %} 

/* Selection frame hugs the image, not the name strip. */
.runner-frame{position:absolute;z-index:35;pointer-events:none;border:4px solid var(--yellow);border-radius:16px;box-shadow:0 0 0 2px #ffed9b,0 0 18px 7px rgba(244,191,53,.95);opacity:0;transform:scale(.96);transition:left .34s cubic-bezier(.2,.9,.25,1),top .34s cubic-bezier(.2,.9,.25,1),width .34s cubic-bezier(.2,.9,.25,1),height .34s cubic-bezier(.2,.9,.25,1),opacity .18s ease,transform .25s ease}
.runner-frame.show{opacity:1;transform:scale(1)}

/* Game-like hero character stage. */
.hero-panel{position:absolute;z-index:15;left:3.1%;top:41.6%;width:48.6%;height:31.9%;overflow:hidden;border-radius:20px;border:3px solid #d9c59e;background:radial-gradient(circle at 50% 42%,#1a5864 0,#0b3441 42%,#061923 82%);box-shadow:0 5px 0 rgba(0,0,0,.28),0 0 0 2px rgba(8,42,53,.65);isolation:isolate}
.hero-panel::before{content:"";position:absolute;inset:-25%;z-index:2;pointer-events:none;background:radial-gradient(circle at 48% 42%,rgba(244,191,53,.38),transparent 25%),radial-gradient(circle at 50% 80%,rgba(239,74,37,.24),transparent 42%),conic-gradient(from 0deg at 50% 50%,transparent 0 12%,rgba(244,191,53,.10) 14%,transparent 18% 40%,rgba(22,197,214,.10) 43%,transparent 48% 72%,rgba(239,74,37,.10) 75%,transparent 80%);mix-blend-mode:screen;animation:stageSpin 9s linear infinite}
.hero-panel::after{content:"";position:absolute;left:7%;right:7%;bottom:7%;height:18%;z-index:2;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.55),transparent 68%);filter:blur(4px);pointer-events:none}
.hero-image{position:absolute;z-index:4;left:50%;top:51%;width:78%;height:112%;object-fit:cover;object-position:center 35%;transform:translate(-50%,-50%) scale(1.08);filter:saturate(1.1) contrast(1.06) drop-shadow(0 14px 8px rgba(0,0,0,.42));transform-origin:center bottom;transition:opacity .12s ease}

.hero-video{
  position:absolute;
  z-index:5;
  left:50%;
  top:50%;
  width:86%;
  height:118%;
  object-fit:contain;
  object-position:center;
  transform:translate(-50%,-50%);
  opacity:0;
  pointer-events:none;
  filter:saturate(1.08) contrast(1.05) drop-shadow(0 16px 10px rgba(0,0,0,.46));
  border-radius:16px;
  will-change:transform,opacity,filter;
}
.hero-video.is-playing{opacity:1}
.hero-panel.video-active .hero-image{opacity:0!important}
.hero-panel.video-active .hero-video{animation:heroVideoEntrance .82s cubic-bezier(.14,.82,.18,1) both}
.hero-panel.video-active::before{animation:stageSpin 3.8s linear infinite, heroGlow .82s ease-out both}
@keyframes heroVideoEntrance{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.78) rotate(-4deg);filter:saturate(.8) brightness(.75) drop-shadow(0 4px 4px rgba(0,0,0,.2))}
  28%{opacity:1;transform:translate(-50%,-51%) scale(1.05) rotate(2deg)}
  58%{transform:translate(-50%,-49%) scale(.985) rotate(-.8deg)}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0);filter:saturate(1.08) contrast(1.05) drop-shadow(0 16px 10px rgba(0,0,0,.46))}
}
@keyframes heroGlow{
  0%{box-shadow:0 0 0 0 rgba(244,191,53,0),0 0 0 rgba(244,191,53,0)}
  35%{box-shadow:0 0 0 8px rgba(244,191,53,.22),0 0 36px rgba(244,191,53,.55)}
  100%{box-shadow:0 0 0 0 rgba(244,191,53,0),0 0 0 rgba(244,191,53,0)}
}
.hero-burst{position:absolute;inset:7%;z-index:5;pointer-events:none;border:2px solid rgba(244,191,53,.0);border-radius:50%;transform:scale(.5);opacity:0}
.hero-panel.hero-change .hero-burst{animation:burst .72s ease-out}
.hero-panel.hero-change .hero-image{animation:heroIn .78s cubic-bezier(.14,.82,.18,1)}
.hero-panel.hero-rookie .hero-image{animation:heroRookie .78s cubic-bezier(.14,.82,.18,1)}
.hero-panel.hero-skater .hero-image{animation:heroSkater .78s cubic-bezier(.14,.82,.18,1)}
.hero-panel.hero-brona .hero-image{animation:heroBrona .86s cubic-bezier(.14,.82,.18,1)}
.hero-panel.hero-racer .hero-image{animation:heroRacer .68s cubic-bezier(.14,.82,.18,1)}
.hero-panel.hero-chiller .hero-image{animation:heroChiller .95s ease-out}
.hero-panel.hero-dreamer .hero-image{animation:heroDreamer .9s cubic-bezier(.14,.82,.18,1)}
@keyframes stageSpin{to{transform:rotate(360deg)}}
@keyframes burst{0%{opacity:.8;transform:scale(.35);box-shadow:0 0 0 0 rgba(244,191,53,.75)}65%{opacity:.35;transform:scale(1.08);box-shadow:0 0 0 16px rgba(244,191,53,.0)}100%{opacity:0;transform:scale(1.25)}}
@keyframes heroIn{0%{opacity:.1;transform:translate(-50%,-50%) scale(1.45) rotate(-2deg)}25%{opacity:1}55%{transform:translate(-50%,-52%) scale(1.02) rotate(.8deg)}100%{transform:translate(-50%,-50%) scale(1.08) rotate(0)}}
@keyframes heroRookie{0%{opacity:0;transform:translate(-50%,5%) scale(1.25)}35%{opacity:1;transform:translate(-50%,-58%) scale(1.02)}70%{transform:translate(-50%,-49%) scale(1.11) rotate(-1deg)}100%{transform:translate(-50%,-50%) scale(1.08)}}
@keyframes heroSkater{0%{opacity:0;transform:translate(-70%,-50%) scale(1.1) rotate(-5deg)}45%{opacity:1;transform:translate(-47%,-50%) scale(1.08) rotate(2deg)}70%{transform:translate(-53%,-50%) scale(1.13) rotate(-1deg)}100%{transform:translate(-50%,-50%) scale(1.08)}}
@keyframes heroBrona{0%{opacity:0;transform:translate(-50%,-50%) scale(.78) rotate(4deg)}25%{opacity:1;transform:translate(-50%,-53%) scale(1.18) rotate(-1deg)}55%{transform:translate(-50%,-49%) scale(1.04) rotate(1deg)}100%{transform:translate(-50%,-50%) scale(1.1) rotate(0)}}
@keyframes heroRacer{0%{opacity:0;transform:translate(-80%,-50%) skewX(-8deg) scale(1.15)}40%{opacity:1;transform:translate(-45%,-50%) skewX(4deg) scale(1.1)}70%{transform:translate(-54%,-50%) skewX(-2deg) scale(1.14)}100%{transform:translate(-50%,-50%) skewX(0) scale(1.08)}}
@keyframes heroChiller{0%{opacity:0;transform:translate(-50%,-60%) scale(1.05)}40%{opacity:1;transform:translate(-50%,-47%) scale(1.08)}70%{transform:translate(-50%,-53%) scale(1.1) rotate(1deg)}100%{transform:translate(-50%,-50%) scale(1.08) rotate(0)}}
@keyframes heroDreamer{0%{opacity:0;transform:translate(-50%,-50%) scale(.72) rotate(-7deg)}35%{opacity:1;transform:translate(-50%,-50%) scale(1.12) rotate(3deg)}65%{transform:translate(-50%,-50%) scale(1.05) rotate(-1deg)}100%{transform:translate(-50%,-50%) scale(1.08) rotate(0)}}

.details{position:absolute;z-index:16;left:53.2%;top:42.2%;width:43.6%;height:31.3%;padding:3.5% 3.5% 2.7%;border:3px solid #d9c59e;border-radius:20px;background:linear-gradient(135deg,rgba(8,42,53,.98),rgba(5,31,40,.98));box-shadow:0 4px 0 rgba(0,0,0,.28);color:var(--cream);overflow:hidden}
.details h1{margin:0;color:var(--cream);font-family:"Cooper Black","Arial Black",Impact,sans-serif;font-size:clamp(18px,4.1vw,38px);line-height:.86;font-style:italic;font-weight:1000;text-shadow:3px 3px 0 #000;white-space:nowrap}
.tag{margin-top:5px;color:var(--yellow);font-family:"Arial Black",Impact,sans-serif;font-size:clamp(7px,1.55vw,15px);font-weight:1000;letter-spacing:.3px;white-space:nowrap}
.desc{margin:7px 0 7px;font-size:clamp(7px,1.42vw,14px);line-height:1.25;min-height:31px}
.stats{border:2px solid #d9c59e;border-radius:13px;padding:5px 7px 4px}
.stat{display:grid;grid-template-columns:34% 1fr 15px;gap:4px;align-items:center;margin:3px 0;font-size:clamp(6px,1.35vw,13px);font-weight:1000}
.bar{height:7px;background:#263e45;border-radius:7px;overflow:hidden}
.fill{height:100%;border-radius:7px;transition:width .38s cubic-bezier(.2,.9,.2,1)}
.speed{background:#ef4a25}.jump{background:#f4bf35}.coin{background:#16c5d6}.energy{background:#46c95a}
.special{display:flex;align-items:center;gap:7px;margin-top:6px}
.badge{width:31px;height:31px;flex:none;border-radius:50%;border:2px solid var(--yellow);background:var(--red);display:grid;place-items:center;font-size:15px}
.special small{display:block;color:var(--yellow);font-size:clamp(5px,1.05vw,10px);font-weight:1000}
.special strong{display:block;font-size:clamp(9px,1.8vw,18px);line-height:1;color:var(--cream)}
.special span{display:block;font-size:clamp(5px,1.05vw,10px);line-height:1.15;margin-top:2px}
.ability-pop{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at 75% 55%,rgba(244,191,53,.22),transparent 48%)}
.ability-pop.flash{animation:flash .55s ease}
@keyframes flash{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
.tap-note{position:absolute;z-index:45;left:4%;right:4%;top:39.2%;text-align:center;pointer-events:none;color:var(--cream);font-size:clamp(7px,1.25vw,12px);font-weight:900;opacity:0;transform:translateY(-3px);text-shadow:2px 2px 0 #071722}
.tap-note.show{animation:note .9s ease}
@keyframes note{0%{opacity:0;transform:translateY(-3px)}20%,75%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* FINAL HERO STAGE — transparent character art, no baked runner underneath */
.hero-panel{
  background:
    radial-gradient(circle at 50% 35%,rgba(30,105,116,.72),transparent 34%),
    radial-gradient(circle at 50% 88%,rgba(244,191,53,.13),transparent 38%),
    linear-gradient(160deg,#0b3a46 0%,#072732 52%,#061923 100%);
  overflow:hidden;
}
.hero-image{
  width:92%;
  height:92%;
  left:50%;
  top:52%;
  object-fit:contain !important;
  object-position:center bottom !important;
  transform:translate(-50%,-50%) scale(1.02);
  filter:saturate(1.12) contrast(1.08) drop-shadow(0 16px 7px rgba(0,0,0,.46));
  transform-origin:center bottom;
  will-change:transform,opacity,filter;
}
.hero-panel::before{
  inset:-35%;
  opacity:.95;
}
.hero-panel::after{
  bottom:5%;
  height:15%;
  opacity:.85;
}

/* Remove the stray horizontal line above the runner names. */
.name-cover{
  border:0 !important;
  box-shadow:none !important;
  background:linear-gradient(180deg,rgba(8,30,39,.96),rgba(6,25,35,.98)) !important;
}

/* More game-like entrance motions for each selected runner. */
.hero-panel.hero-rookie .hero-image{
  animation:heroRookiePro .78s cubic-bezier(.15,.9,.2,1);
}
.hero-panel.hero-skater .hero-image{
  animation:heroSkaterPro .82s cubic-bezier(.18,.85,.18,1);
}
.hero-panel.hero-brona .hero-image{
  animation:heroBronaPro .88s cubic-bezier(.14,.9,.2,1);
}
.hero-panel.hero-racer .hero-image{
  animation:heroRacerPro .68s cubic-bezier(.16,.9,.2,1);
}
.hero-panel.hero-chiller .hero-image{
  animation:heroChillerPro 1.0s ease-out;
}
.hero-panel.hero-dreamer .hero-image{
  animation:heroDreamerPro .92s cubic-bezier(.16,.84,.18,1);
}

@keyframes heroRookiePro{
  0%{opacity:0;transform:translate(-50%,14%) scale(.88) rotate(-5deg)}
  35%{opacity:1;transform:translate(-50%,-54%) scale(1.10) rotate(2deg)}
  58%{transform:translate(-50%,-48%) scale(1.02) rotate(-1deg)}
  78%{transform:translate(-50%,-51%) scale(1.05) rotate(.5deg)}
  100%{transform:translate(-50%,-50%) scale(1.02) rotate(0)}
}
@keyframes heroSkaterPro{
  0%{opacity:0;transform:translate(-78%,-50%) scale(.94) rotate(-8deg)}
  30%{opacity:1;transform:translate(-42%,-50%) scale(1.08) rotate(5deg)}
  55%{transform:translate(-56%,-50%) scale(1.03) rotate(-3deg)}
  78%{transform:translate(-48%,-50%) scale(1.05) rotate(1.5deg)}
  100%{transform:translate(-50%,-50%) scale(1.02) rotate(0)}
}
@keyframes heroBronaPro{
  0%{opacity:0;transform:translate(-50%,-48%) scale(.68) rotate(7deg)}
  22%{opacity:1;transform:translate(-50%,-53%) scale(1.18) rotate(-3deg)}
  43%{transform:translate(-50%,-48%) scale(1.05) rotate(2deg)}
  68%{transform:translate(-50%,-51%) scale(1.10) rotate(-.8deg)}
  100%{transform:translate(-50%,-50%) scale(1.02) rotate(0)}
}
@keyframes heroRacerPro{
  0%{opacity:0;transform:translate(-105%,-50%) scale(1.08) skewX(-10deg)}
  32%{opacity:1;transform:translate(-40%,-50%) scale(1.08) skewX(6deg)}
  54%{transform:translate(-57%,-50%) scale(1.04) skewX(-3deg)}
  76%{transform:translate(-48%,-50%) scale(1.05) skewX(1deg)}
  100%{transform:translate(-50%,-50%) scale(1.02) skewX(0)}
}
@keyframes heroChillerPro{
  0%{opacity:0;transform:translate(-50%,-67%) scale(.94) rotate(0)}
  32%{opacity:1;transform:translate(-50%,-47%) scale(1.03) rotate(1deg)}
  58%{transform:translate(-50%,-53%) scale(1.05) rotate(-1deg)}
  78%{transform:translate(-50%,-49%) scale(1.03) rotate(.6deg)}
  100%{transform:translate(-50%,-50%) scale(1.02) rotate(0)}
}
@keyframes heroDreamerPro{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.72) rotate(-9deg)}
  30%{opacity:1;transform:translate(-50%,-50%) scale(1.10) rotate(5deg)}
  55%{transform:translate(-50%,-50%) scale(1.03) rotate(-3deg)}
  78%{transform:translate(-50%,-50%) scale(1.05) rotate(1deg)}
  100%{transform:translate(-50%,-50%) scale(1.02) rotate(0)}
}


@media (max-width:520px){
  .stage{width:min(100vw,calc(100svh * .5783));height:min(100svh,calc(100vw * 1.7289))}
  .hero-video{width:88%;height:120%}
}
@media (prefers-reduced-motion:reduce){
  .hero-video,.hero-panel::before,.card-hit{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="stage" id="stage">
<img class="base" src="./assets/screen03-background.png" alt="BARAMEEL RUN — Choose Your Runner">

<!-- Clean redraw of the runner name plates -->
<div class="name-cover" style="left:2.2%;width:15.8%"></div><div class="name-cover" style="left:18%;width:15.8%"></div><div class="name-cover" style="left:33.6%;width:16.2%"></div><div class="name-cover" style="left:49.3%;width:15.8%"></div><div class="name-cover" style="left:65.2%;width:15.8%"></div><div class="name-cover" style="left:81.2%;width:16.5%"></div>
<div class="name" style="left:2.2%;width:15.8%">THE ROOKIE</div><div class="name" style="left:18%;width:15.8%">THE SKATER</div><div class="name" style="left:33.6%;width:16.2%">BRONA</div><div class="name" style="left:49.3%;width:15.8%">THE RACER</div><div class="name" style="left:65.2%;width:15.8%">THE CHILLER</div><div class="name" style="left:81.2%;width:16.5%">THE DREAMER</div>

<div class="hero-panel hero-brona" id="heroPanel"><div class="hero-burst"></div><img class="hero-image" id="heroImage" src="./assets/runner-brona.png" alt="BRONA"><video class="hero-video" id="heroVideo" playsinline preload="auto" aria-hidden="true"></video></div>

<button class="hotspot card-hit" data-runner="brona" style="left:33.6%;top:20.2%;width:16.2%;height:14.8%" aria-label="BRONA"></button>
<button class="hotspot card-hit" data-runner="racer" style="left:49.3%;top:20.45%;width:15.8%;height:14.55%" aria-label="THE RACER"></button>
<button class="hotspot card-hit" data-runner="chiller" style="left:65.2%;top:20.45%;width:15.8%;height:14.55%" aria-label="THE CHILLER"></button>

<div class="tap-note" id="tapNote"></div>
<div class="details" id="details"><div class="ability-pop" id="abilityPop"></div><h1 id="name">BRONA</h1><div class="tag" id="tag">VIBES LEAD THE WAY</div><p class="desc" id="desc"></p><div class="stats"><div class="stat"><span>SPEED</span><div class="bar"><div id="speed" class="fill speed"></div></div><b id="speedN"></b></div><div class="stat"><span>JUMP</span><div class="bar"><div id="jump" class="fill jump"></div></div><b id="jumpN"></b></div><div class="stat"><span>COIN BOOST</span><div class="bar"><div id="coin" class="fill coin"></div></div><b id="coinN"></b></div><div class="stat"><span>ENERGY</span><div class="bar"><div id="energy" class="fill energy"></div></div><b id="energyN"></b></div></div><div class="special"><div class="badge" id="badge">★</div><div><small>SPECIAL ABILITY</small><strong id="special"></strong><span id="effect"></span></div></div></div>
</div>
<script>
const runners={"rookie":{"name":"THE ROOKIE","tag":"THE FRESH START","desc":"Balanced and easy to learn. A dependable choice for your first run.","speed":3,"jump":3,"coin":4,"energy":4,"special":"LUCKY START","effect":"Starts each run with a short bonus to collected marks.","note":"Fresh start • steady balance"},"skater":{"name":"THE SKATER","tag":"THE FLOW MASTER","desc":"Built for movement. Great at jumps and keeping momentum.","speed":4,"jump":5,"coin":3,"energy":4,"special":"FLOW MODE","effect":"Successful jumps briefly improve movement speed.","note":"Flow on • jump higher • move faster"},"brona":{"name":"BRONA","tag":"VIBES LEAD THE WAY","desc":"Fast, stylish, positive — the signature runner built to shine across every part of the run.","speed":5,"jump":5,"coin":5,"energy":5,"special":"MAGNET MOOD","effect":"Attracts more marks for longer and keeps the good mood going.","note":"GOOD VIBES • MAX POWER • MORE MARKS"},"racer":{"name":"THE RACER","tag":"THE SPEED MACHINE","desc":"Pure speed. Designed for players who want to push the pace.","speed":5,"jump":4,"coin":3,"energy":3,"special":"TURBO RUSH","effect":"Activates a short burst of extra running speed.","note":"Full speed • push the pace"},"chiller":{"name":"THE CHILLER","tag":"THE STEADY ONE","desc":"Relaxed and resilient. Keeps going when the run gets long.","speed":3,"jump":3,"coin":4,"energy":5,"special":"EASY VIBES","effect":"Energy drains more slowly during the run.","note":"Easy vibes • stay in the run"},"dreamer":{"name":"THE DREAMER","tag":"THE EXPLORER","desc":"Curious and reward-focused. Made for discovering more along the route.","speed":4,"jump":4,"coin":5,"energy":4,"special":"DISCOVERY BOOST","effect":"Gets extra marks from newly discovered route spots.","note":"Explore more • discover more"}};
const sounds={"rookie":[392,523,659],"skater":[330,494,659,784],"brona":[523,659,784,1047],"racer":[262,392,523,784],"chiller":[261,329,392],"dreamer":[440,554,659,880]};
const imgs={
  "rookie":"./assets/runner-rookie.png",
  "skater":"./assets/runner-skater.png",
  "brona":"./assets/runner-brona.png",
  "racer":"./assets/runner-racer.png",
  "chiller":"./assets/runner-chiller.png",
  "dreamer":"./assets/runner-dreamer.png"
};
const videos={
  "rookie":null,
  "skater":null,
  "brona":"./assets/videos/brona-select.mp4",
  "racer":null,
  "chiller":null,
  "dreamer":null
};
const cards={"rookie":[2.2,20.45,15.8,14.55],"skater":[18.0,20.45,15.8,14.55],"brona":[33.6,20.2,16.2,14.8],"racer":[49.3,20.45,15.8,14.55],"chiller":[65.2,20.45,15.8,14.55],"dreamer":[81.2,20.45,16.5,14.55]};
const zones=[...document.querySelectorAll('.card-hit')];
const frame=document.getElementById('frame'), stage=document.getElementById('stage'), note=document.getElementById('tapNote'), pop=document.getElementById('abilityPop'), heroPanel=document.getElementById('heroPanel'), heroImage=document.getElementById('heroImage'), heroVideo=document.getElementById('heroVideo');
function setFrame(key){const [l,t,w,h]=cards[key];frame.style.left=(l-0.35)+'%';frame.style.top=(t-0.35)+'%';frame.style.width=(w+0.7)+'%';frame.style.height=(h+0.7)+'%';frame.classList.add('show')}
function updateDetails(key){const r=runners[key];document.getElementById('name').textContent=r.name;document.getElementById('tag').textContent=r.tag;document.getElementById('desc').textContent=r.desc;document.getElementById('special').textContent=r.special;document.getElementById('effect').textContent=r.effect;['speed','jump','coin','energy'].forEach(k=>{document.getElementById(k).style.width=(r[k]*20)+'%';document.getElementById(k+'N').textContent=r[k]+'/5'});document.title='BARAMEEL RUN — '+r.name}
function playSound(freqs){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const ctx=window._barameelAudio||(window._barameelAudio=new C());if(ctx.state==='suspended')ctx.resume();const now=ctx.currentTime;freqs.forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type=i%2?'triangle':'square';o.frequency.setValueAtTime(f,now+i*.065);g.gain.setValueAtTime(.0001,now+i*.065);g.gain.exponentialRampToValueAtTime(.055,now+i*.065+.018);g.gain.exponentialRampToValueAtTime(.0001,now+i*.065+.16);o.connect(g);g.connect(ctx.destination);o.start(now+i*.065);o.stop(now+i*.065+.18)})}catch(e){}}
let videoRunToken=0;
function stopHeroVideo(){
  videoRunToken++;
  heroVideo.pause();
  heroVideo.removeAttribute('src');
  heroVideo.load();
  heroVideo.classList.remove('is-playing');
  heroPanel.classList.remove('video-active');
}
function showStaticHero(key){
  heroImage.style.animation='none';
  void heroImage.offsetWidth;
  heroImage.src=imgs[key];
  heroImage.alt=runners[key].name;
  heroImage.style.opacity='1';
  heroVideo.classList.remove('is-playing');
  heroPanel.classList.remove('video-active');
}
function playHeroVideo(key){
  const src=videos[key];
  if(!src){ showStaticHero(key); return; }
  const token=++videoRunToken;
  heroImage.style.opacity='0';
  heroVideo.pause();
  heroVideo.src=src;
  heroVideo.currentTime=0;
  heroVideo.muted=false;
  heroVideo.volume=.72;
  heroVideo.classList.add('is-playing');
  heroPanel.classList.add('video-active');
  void heroPanel.offsetWidth;
  heroVideo.play().catch(()=>{
    // Browser blocked media playback: keep the static artwork visible.
    if(token===videoRunToken) showStaticHero(key);
  });
  heroVideo.onended=()=>{
    if(token!==videoRunToken || window._activeRunner!==key) return;
    showStaticHero(key);
    heroImage.style.animation='none';
    void heroImage.offsetWidth;
    heroImage.className='hero-image';
    heroImage.style.opacity='1';
    heroPanel.className='hero-panel hero-'+key;
  };
}
function selectRunner(key,el){
  window._activeRunner=key;
  zones.forEach(z=>z.className='hotspot card-hit');
  el.classList.add('play-'+key);
  setFrame(key);
  updateDetails(key);

  stopHeroVideo();
  heroPanel.className='hero-panel hero-'+key+' hero-change';
  showStaticHero(key);
  void heroPanel.offsetWidth;
  heroPanel.className='hero-panel hero-'+key+' hero-change';

  // Use the video as the character's cinematic entrance when one exists.
  setTimeout(()=>{ if(window._activeRunner===key) playHeroVideo(key); },90);

  // Keep the established BARAMEEL selection sound system for runners without video.
  if(!videos[key]) playSound(sounds[key]);

  note.textContent=runners[key].note;
  note.className='tap-note show';
  pop.className='ability-pop flash';
  setTimeout(()=>note.className='tap-note',950);
  setTimeout(()=>pop.className='ability-pop',600);
}
zones.forEach(el=>el.addEventListener('click',()=>selectRunner(el.dataset.runner,el)));
window._activeRunner='brona';updateDetails('brona');setFrame('brona');
</script>
</body></html>

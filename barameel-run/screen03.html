<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071722">
<title>BARAMEEL RUN — Screen 03</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#071722;overflow:hidden}
body{display:flex;justify-content:center;align-items:center;touch-action:manipulation}
.stage{position:relative;width:min(100vw,100vh * .5625);height:min(100vh,100vw * 1.7777778);max-width:560px;max-height:995px}
.art{width:100%;height:100%;display:block;object-fit:contain;user-select:none;-webkit-user-drag:none}
.hotspot{position:absolute;border:0;background:transparent;padding:0;cursor:pointer}
.r1{left:2.5%;top:35.5%;width:16%;height:28%}
.r2{left:19%;top:35.5%;width:16%;height:28%}
.r3{left:35.5%;top:35%;width:17%;height:29%}
.r4{left:53%;top:35.5%;width:16%;height:28%}
.r5{left:69.5%;top:35.5%;width:16%;height:28%}
.r6{left:86%;top:35.5%;width:12%;height:28%}
.lets{left:57%;top:82.5%;width:36%;height:8.5%}
.back{left:3%;top:2%;width:17%;height:6%}
.toast{position:absolute;left:8%;right:8%;bottom:3%;padding:10px 14px;background:#081722;color:#f5e9dc;border:3px solid #f0c830;border-radius:14px;font:900 12px Arial;text-align:center;display:none;z-index:5}
</style>
</head>
<body>
<div class="stage">
<img class="art" src="./assets/screen03-runner-selection.png" alt="BARAMEEL RUN — Choose Your Runner">
<a class="hotspot back" href="./screen02.html" aria-label="Back to Screen 02"></a>
<button class="hotspot r1" aria-label="The Rookie" onclick="pick('THE ROOKIE')"></button>
<button class="hotspot r2" aria-label="The Skater" onclick="pick('THE SKATER')"></button>
<button class="hotspot r3" aria-label="Brona" onclick="pick('BRONA')"></button>
<button class="hotspot r4" aria-label="The Racer" onclick="pick('THE RACER')"></button>
<button class="hotspot r5" aria-label="The Chiller" onclick="pick('THE CHILLER')"></button>
<button class="hotspot r6" aria-label="The Dreamer" onclick="pick('THE DREAMER')"></button>
<button class="hotspot lets" aria-label="Let's Run" onclick="nextStep()"></button>
<div class="toast" id="toast"></div>
</div>
<script>
let selected='BRONA';
function pick(name){
 selected=name;
 const t=document.getElementById('toast');
 t.textContent=name+' selected — runner abilities will be used in the gameplay.';
 t.style.display='block';
 clearTimeout(window._toast);
 window._toast=setTimeout(()=>t.style.display='none',1800);
}
function nextStep(){
 const t=document.getElementById('toast');
 t.textContent=selected+' selected. Screen 04 — RUN MODE will use this runner.';
 t.style.display='block';
}
</script>
</body>
</html>

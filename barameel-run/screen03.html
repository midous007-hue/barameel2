<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>BARAMEEL RUN — Choose Your Runner</title>
<style>
:root{
 --teal:#082a35;--deep:#061923;--cream:#f7ead7;--yellow:#f4bf35;
 --orange:#ef4a25;--red:#b82b1e;--ink:#102832;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#071722;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif}
.stage{position:relative;width:min(100vw,57.83vh);height:min(172.89vw,100vh);aspect-ratio:996/1722;overflow:hidden}
.base{width:100%;height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}
.hotspot{position:absolute;display:block;z-index:8;cursor:pointer;border:0;background:transparent;padding:0}
.hotspot .hit{position:absolute;inset:0}
.back{left:1%;top:2%;width:19%;height:5.5%;z-index:20}

/* Moving selection frame — it follows the active runner. */
.runner-frame{
 position:absolute;z-index:12;pointer-events:none;border:4px solid var(--yellow);
 border-radius:16px;box-shadow:0 0 0 2px #ffed9b,0 0 18px 7px rgba(244,191,53,.95);
 opacity:0;transform:scale(.96);
 transition:left .34s cubic-bezier(.2,.9,.25,1),top .34s cubic-bezier(.2,.9,.25,1),
 width .34s cubic-bezier(.2,.9,.25,1),height .34s cubic-bezier(.2,.9,.25,1),
 opacity .18s ease,transform .25s ease;
}
.runner-frame.show{opacity:1;transform:scale(1)}

/* Character-specific tap animations. */
.card-hit{transition:transform .12s ease;transform-origin:center}
.card-hit.play-rookie{animation:rookie .62s ease}
.card-hit.play-skater{animation:skater .72s cubic-bezier(.2,.8,.2,1)}
.card-hit.play-brona{animation:brona .72s ease}
.card-hit.play-racer{animation:racer .62s cubic-bezier(.2,.8,.2,1)}
.card-hit.play-chiller{animation:chiller .9s ease}
.card-hit.play-dreamer{animation:dreamer .9s ease}
@keyframes rookie{0%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-9px) scale(1.03)}55%{transform:translateY(2px) rotate(-2deg) scale(1.02)}75%{transform:rotate(2deg)}}
@keyframes skater{0%{transform:translateX(0) rotate(0)}25%{transform:translateX(-9px) rotate(-3deg)}55%{transform:translateX(10px) rotate(3deg)}100%{transform:translateX(0) rotate(0)}}
@keyframes brona{0%{transform:scale(1)}25%{transform:scale(1.055) rotate(-1.5deg)}50%{transform:scale(.985) rotate(1deg)}75%{transform:scale(1.035)}100%{transform:scale(1)}}
@keyframes racer{0%{transform:translateX(0) skewX(0)}20%{transform:translateX(-10px) skewX(-3deg)}50%{transform:translateX(13px) skewX(3deg)}100%{transform:translateX(0) skewX(0)}}
@keyframes chiller{0%,100%{transform:translateY(0)}35%{transform:translateY(-7px) rotate(1deg)}70%{transform:translateY(3px) rotate(-1deg)}}
@keyframes dreamer{0%{transform:scale(1) rotate(0)}25%{transform:scale(1.045) rotate(2deg)}50%{transform:scale(1.02) rotate(-2deg)}75%{transform:scale(1.04) rotate(1deg)}100%{transform:scale(1) rotate(0)}}


.card-anim{
 position:absolute;z-index:13;pointer-events:none;display:none;
 background-image:url("./assets/screen03-base.png");background-repeat:no-repeat;
 border-radius:12px;filter:drop-shadow(0 5px 5px rgba(0,0,0,.35));
}
.card-anim.play{display:block}
.card-anim.rookie{animation:animRookie .62s ease}
.card-anim.skater{animation:animSkater .72s cubic-bezier(.2,.8,.2,1)}
.card-anim.brona{animation:animBrona .72s ease}
.card-anim.racer{animation:animRacer .62s cubic-bezier(.2,.8,.2,1)}
.card-anim.chiller{animation:animChiller .9s ease}
.card-anim.dreamer{animation:animDreamer .9s ease}
@keyframes animRookie{0%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-10px) scale(1.035)}55%{transform:translateY(2px) rotate(-2deg) scale(1.02)}75%{transform:rotate(2deg)}}
@keyframes animSkater{0%{transform:translateX(0) rotate(0)}25%{transform:translateX(-11px) rotate(-3deg)}55%{transform:translateX(12px) rotate(3deg)}100%{transform:translateX(0) rotate(0)}}
@keyframes animBrona{0%{transform:scale(1)}25%{transform:scale(1.06) rotate(-1.5deg)}50%{transform:scale(.985) rotate(1deg)}75%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes animRacer{0%{transform:translateX(0) skewX(0)}20%{transform:translateX(-12px) skewX(-3deg)}50%{transform:translateX(14px) skewX(3deg)}100%{transform:translateX(0) skewX(0)}}
@keyframes animChiller{0%,100%{transform:translateY(0)}35%{transform:translateY(-8px) rotate(1deg)}70%{transform:translateY(3px) rotate(-1deg)}}
@keyframes animDreamer{0%{transform:scale(1) rotate(0)}25%{transform:scale(1.05) rotate(2deg)}50%{transform:scale(1.02) rotate(-2deg)}75%{transform:scale(1.045) rotate(1deg)}100%{transform:scale(1) rotate(0)}}


/* Large active-runner portrait: replaces the baked Brona portrait without leaving the screen. */
.hero-panel{
 position:absolute;z-index:9;left:3.1%;top:41.6%;width:48.6%;height:31.9%;
 border-radius:20px;overflow:hidden;background:#0a2934;
 border:3px solid #d9c59e;box-shadow:0 5px 0 rgba(0,0,0,.28),0 0 0 2px rgba(8,42,53,.65);
 isolation:isolate;
}
.hero-panel::before{
 content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
 background:
   radial-gradient(circle at 30% 30%,rgba(244,191,53,.22),transparent 38%),
   linear-gradient(90deg,rgba(5,25,34,.04) 55%,rgba(5,25,34,.62) 100%);
 mix-blend-mode:screen;
}
.hero-panel::after{
 content:"";position:absolute;inset:-20%;z-index:3;pointer-events:none;opacity:0;
 background:conic-gradient(from 0deg at 50% 50%,transparent 0 16%,rgba(244,191,53,.22) 18%,transparent 22% 45%,rgba(239,74,37,.18) 48%,transparent 52% 76%,rgba(22,197,214,.16) 80%,transparent 84%);
}
.hero-image{
 position:absolute;inset:-3%;width:106%;height:106%;object-fit:cover;object-position:center 35%;
 filter:saturate(1.08) contrast(1.04);
 transform:scale(1.04);
 transition:opacity .16s ease,transform .38s cubic-bezier(.2,.9,.2,1),filter .38s ease;
}
.hero-panel.hero-change::after{animation:heroRays .72s ease}
.hero-panel.hero-change .hero-image{animation:heroSlam .72s cubic-bezier(.16,.8,.2,1)}
@keyframes heroSlam{
 0%{opacity:.15;transform:scale(1.24) translateX(3%) rotate(-1deg);filter:saturate(1.45) contrast(1.15)}
 22%{opacity:1}
 52%{transform:scale(1.01) translateX(-1%) rotate(.4deg);filter:saturate(1.15) contrast(1.08)}
 78%{transform:scale(1.065) translateX(.4%) rotate(-.2deg)}
 100%{opacity:1;transform:scale(1.04) translateX(0) rotate(0);filter:saturate(1.08) contrast(1.04)}
}
@keyframes heroRays{
 0%{opacity:0;transform:rotate(-10deg) scale(.82)}
 24%{opacity:1}
 100%{opacity:0;transform:rotate(8deg) scale(1.08)}
}

/* Clean BARAMEEL-style runner-name labels, aligned to the card image itself. */
.runner-label{
 position:absolute;z-index:14;pointer-events:none;
 top:35.1%;height:2.55%;display:flex;align-items:center;justify-content:center;
 color:#f7ead7;font-family:Impact,"Arial Black",Haettenschweiler,sans-serif;
 font-size:clamp(7px,1.42vw,14px);font-weight:900;letter-spacing:.2px;
 text-transform:uppercase;line-height:1;text-shadow:2px 2px 0 #071722,-1px -1px 0 #071722;
 white-space:nowrap;
}
.label-rookie{left:2.2%;width:15.8%}
.label-skater{left:18.0%;width:15.8%}
.label-brona{left:33.6%;width:16.2%}
.label-racer{left:49.3%;width:15.8%}
.label-chiller{left:65.2%;width:15.8%}
.label-dreamer{left:81.2%;width:16.5%}

/* The selection frame is deliberately limited to the portrait image, not the name strip. */
.runner-frame{
 border-width:4px;
}

/* Dynamic details panel: same location/style family as the baked Brona panel. */
.details{
 position:absolute;z-index:10;left:53.2%;top:42.2%;width:43.6%;height:31.3%;
 padding:3.5% 3.5% 2.7%;border:3px solid #d9c59e;border-radius:20px;
 background:linear-gradient(135deg,rgba(8,42,53,.98),rgba(5,31,40,.98));
 box-shadow:0 4px 0 rgba(0,0,0,.28);
 color:var(--cream);overflow:hidden;
}
.details h1{margin:0;color:var(--cream);font-size:clamp(18px,4.1vw,38px);line-height:.86;font-style:italic;font-weight:1000;text-shadow:3px 3px 0 #000;white-space:nowrap}
.tag{margin-top:5px;color:var(--yellow);font-size:clamp(7px,1.55vw,15px);font-weight:1000;letter-spacing:.3px;white-space:nowrap}
.desc{margin:7px 0 7px;font-size:clamp(7px,1.42vw,14px);line-height:1.25;min-height:31px}
.stats{border:2px solid #d9c59e;border-radius:13px;padding:5px 7px 4px}
.stat{display:grid;grid-template-columns:34% 1fr 15px;gap:4px;align-items:center;margin:3px 0;font-size:clamp(6px,1.35vw,13px);font-weight:1000}
.bar{height:7px;background:#263e45;border-radius:7px;overflow:hidden}
.fill{height:100%;border-radius:7px;transition:width .38s cubic-bezier(.2,.9,.2,1)}
.speed{background:#ef4a25}.jump{background:#f4bf35}.coin{background:#16c5d6}.energy{background:#46c95a}
.special{display:flex;align-items:center;gap:7px;margin-top:6px}
.badge{width:31px;height:31px;flex:none;border-radius:50%;border:2px solid var(--yellow);background:var(--red);display:grid;place-items:center;font-size:15px}
.special small{display:block;color:var(--yellow);font-size:clamp(5px,1.05vw,10px);font-weight:1000}
.special strong{display:block;font-size:clamp(9px,1.8vw,18px);line-height:1;color:var(--cream)}
.special span{display:block;font-size:clamp(5px,1.05vw,10px);line-height:1.15;margin-top:2px}
.ability-pop{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at 75% 55%,rgba(244,191,53,.22),transparent 48%)}
.ability-pop.flash{animation:flash .55s ease}
@keyframes flash{0%{opacity:0}25%{opacity:1}100%{opacity:0}}

.tap-note{position:absolute;z-index:16;left:4%;right:4%;top:39.3%;text-align:center;pointer-events:none;color:var(--cream);font-size:clamp(7px,1.25vw,12px);font-weight:900;opacity:0;transform:translateY(-3px)}
.tap-note.show{animation:note .9s ease}
@keyframes note{0%{opacity:0;transform:translateY(-3px)}20%,75%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-4px)}}

@media (prefers-reduced-motion:reduce){
 .card-hit,.runner-frame,.fill{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="stage" id="stage">
<img class="base" src="./assets/screen03-base.png" alt="BARAMEEL RUN — Choose Your Runner">

<div class="hero-panel" id="heroPanel">
  <img class="hero-image" id="heroImage" src="./assets/brona.png" alt="Active runner">
</div>

<div class="runner-label label-rookie">THE ROOKIE</div>
<div class="runner-label label-skater">THE SKATER</div>
<div class="runner-label label-brona">BRONA</div>
<div class="runner-label label-racer">THE RACER</div>
<div class="runner-label label-chiller">THE CHILLER</div>
<div class="runner-label label-dreamer">THE DREAMER</div>

<a class="hotspot back" href="./screen02.html" aria-label="Back to Screen 02"></a>

<!-- runner hit zones -->
<button class="hotspot card-hit" data-runner="rookie" style="left:2.2%;top:20.5%;width:15.8%;height:17.5%" aria-label="THE ROOKIE"></button>
<button class="hotspot card-hit" data-runner="skater" style="left:18.0%;top:20.5%;width:15.8%;height:17.5%" aria-label="THE SKATER"></button>
<button class="hotspot card-hit" data-runner="brona" style="left:33.6%;top:20.2%;width:16.2%;height:18.0%" aria-label="BRONA"></button>
<button class="hotspot card-hit" data-runner="racer" style="left:49.3%;top:20.5%;width:15.8%;height:17.5%" aria-label="THE RACER"></button>
<button class="hotspot card-hit" data-runner="chiller" style="left:65.2%;top:20.5%;width:15.8%;height:17.5%" aria-label="THE CHILLER"></button>
<button class="hotspot card-hit" data-runner="dreamer" style="left:81.2%;top:20.5%;width:16.5%;height:17.5%" aria-label="THE DREAMER"></button>

<div class="runner-frame" id="frame"></div><div class="card-anim" id="cardAnim"></div>
<div class="tap-note" id="tapNote"></div>

<div class="details" id="details">
  <div class="ability-pop" id="abilityPop"></div>
  <h1 id="name">BRONA</h1>
  <div class="tag" id="tag">VIBES LEAD THE WAY</div>
  <p class="desc" id="desc"></p>
  <div class="stats">
    <div class="stat"><span>SPEED</span><div class="bar"><div id="speed" class="fill speed"></div></div><b id="speedN"></b></div>
    <div class="stat"><span>JUMP</span><div class="bar"><div id="jump" class="fill jump"></div></div><b id="jumpN"></b></div>
    <div class="stat"><span>COIN BOOST</span><div class="bar"><div id="coin" class="fill coin"></div></div><b id="coinN"></b></div>
    <div class="stat"><span>ENERGY</span><div class="bar"><div id="energy" class="fill energy"></div></div><b id="energyN"></b></div>
  </div>
  <div class="special"><div class="badge" id="badge">★</div><div><small>SPECIAL ABILITY</small><strong id="special"></strong><span id="effect"></span></div></div>
</div>
</div>

<script>
const runners={
 rookie:{name:"THE ROOKIE",tag:"THE FRESH START",desc:"Balanced and easy to learn. A dependable choice for your first run.",speed:2,jump:2,coin:3,energy:5,special:"LUCKY START",effect:"Starts each run with a short bonus to collected marks.",note:"Fresh start • steady balance",sound:[392,523,659]},
 skater:{name:"THE SKATER",tag:"THE FLOW MASTER",desc:"Built for movement. Great at jumps and keeping momentum.",speed:4,jump:5,coin:2,energy:4,special:"FLOW MODE",effect:"Successful jumps briefly improve movement speed.",note:"Flow on • jump higher • move faster",sound:[330,494,659,784]},
 brona:{name:"BRONA",tag:"VIBES LEAD THE WAY",desc:"Fast, stylish, and always positive. Built around collecting more.",speed:4,jump:3,coin:5,energy:4,special:"MAGNET MOOD",effect:"Attracts more coins for a short time.",note:"Good vibes • more marks • more mood",sound:[523,659,784,1047]},
 racer:{name:"THE RACER",tag:"THE SPEED MACHINE",desc:"Pure speed. Designed for players who want to push the pace.",speed:5,jump:4,coin:2,energy:3,special:"TURBO RUSH",effect:"Activates a short burst of extra running speed.",note:"Full speed • push the pace",sound:[262,392,523,784]},
 chiller:{name:"THE CHILLER",tag:"THE STEADY ONE",desc:"Relaxed and resilient. Keeps going when the run gets long.",speed:3,jump:2,coin:4,energy:5,special:"EASY VIBES",effect:"Energy drains more slowly during the run.",note:"Easy vibes • stay in the run",sound:[261,329,392]},
 dreamer:{name:"THE DREAMER",tag:"THE EXPLORER",desc:"Curious and reward-focused. Made for discovering more along the route.",speed:3,jump:3,coin:5,energy:4,special:"DISCOVERY BOOST",effect:"Gets extra marks from newly discovered route spots.",note:"Explore more • discover more",sound:[440,554,659,880]}
};

const zones=[...document.querySelectorAll('.card-hit')];
const frame=document.getElementById('frame');
const stage=document.getElementById('stage');
const note=document.getElementById('tapNote');
const pop=document.getElementById('abilityPop');
const heroPanel=document.getElementById('heroPanel');
const heroImage=document.getElementById('heroImage');

function setFrame(el){
 const s=stage.getBoundingClientRect(), r=el.getBoundingClientRect();
 const topPad=0.02, bottomPad=0.145;
 frame.style.left=((r.left-s.left)/s.width*100-0.35)+'%';
 frame.style.top=((r.top-s.top)/s.height*100-0.35)+'%';
 frame.style.width=((r.width/s.width*100)+0.7)+'%';
 frame.style.height=((r.height/s.height*100)-bottomPad*100+0.7)+'%';
 frame.classList.add('show');
}

function updateDetails(key){
 const r=runners[key];
 document.getElementById('name').textContent=r.name;
 document.getElementById('tag').textContent=r.tag;
 document.getElementById('desc').textContent=r.desc;
 document.getElementById('special').textContent=r.special;
 document.getElementById('effect').textContent=r.effect;
 ['speed','jump','coin','energy'].forEach(k=>{
   document.getElementById(k).style.width=(r[k]*20)+'%';
   document.getElementById(k+'N').textContent=r[k]+'/5';
 });
 document.title='BARAMEEL RUN — '+r.name;
}

function playSound(freqs){
 try{
   const C=window.AudioContext||window.webkitAudioContext;
   if(!C)return;
   const ctx=window._barameelAudio||(window._barameelAudio=new C());
   if(ctx.state==='suspended')ctx.resume();
   const now=ctx.currentTime;
   freqs.forEach((f,i)=>{
     const o=ctx.createOscillator(), g=ctx.createGain();
     o.type=i%2?'triangle':'square';
     o.frequency.setValueAtTime(f,now+i*.065);
     g.gain.setValueAtTime(.0001,now+i*.065);
     g.gain.exponentialRampToValueAtTime(.055,now+i*.065+.018);
     g.gain.exponentialRampToValueAtTime(.0001,now+i*.065+.16);
     o.connect(g);g.connect(ctx.destination);
     o.start(now+i*.065);o.stop(now+i*.065+.18);
   });
 }catch(e){}
}

function selectRunner(key,el){
 window._activeRunner=key;
 zones.forEach(z=>z.className='hotspot card-hit');
 el.classList.add('play-'+key);
 setFrame(el);
 updateDetails(key);

 /* Swap the large portrait on the same screen, then hit it with a character-specific entrance. */
 heroImage.style.opacity='0';
 setTimeout(()=>{
   heroImage.src='./assets/'+key+'.png';
   heroImage.alt=runners[key].name;
   heroPanel.classList.remove('hero-change');
   void heroPanel.offsetWidth;
   heroPanel.classList.add('hero-change');
   heroImage.style.opacity='1';
 },90);
 playSound(runners[key].sound);
 note.textContent=runners[key].note;
 note.className='tap-note show';
 pop.className='ability-pop flash';

 const anim=document.getElementById('cardAnim');
 const s=stage.getBoundingClientRect(), r=el.getBoundingClientRect();
 const left=(r.left-s.left)/s.width*100, top=(r.top-s.top)/s.height*100;
 const w=r.width/s.width*100, h=r.height/s.height*100;
 anim.style.left=left+'%'; anim.style.top=top+'%'; anim.style.width=w+'%'; anim.style.height=h+'%';
 anim.style.backgroundSize=(100/w)+'% '+(100/h)+'%';
 const bx=(left/w)/(1-w)*100;
 const by=(top/h)/(1-h)*100;
 anim.style.backgroundPosition=(-bx)+'% '+(-by)+'%';
 anim.className='card-anim '+key+' play';
 void anim.offsetWidth;
 anim.className='card-anim '+key+' play';
 setTimeout(()=>{anim.className='card-anim';},850);
 setTimeout(()=>note.className='tap-note',950);
 setTimeout(()=>pop.className='ability-pop',600);
}

zones.forEach(el=>el.addEventListener('click',()=>selectRunner(el.dataset.runner,el)));

window.addEventListener('resize',()=>{
 const active=zones.find(z=>z.dataset.runner===(window._activeRunner||'brona'));
 if(active)setFrame(active);
});
window._activeRunner='brona';
updateDetails('brona');
heroImage.src='./assets/brona.png';
setTimeout(()=>{setFrame(document.querySelector('[data-runner="brona"]'));},40);
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>BARAMEEL RUN — Choose Your Runner</title>
<style>
:root{--teal:#082a35;--deep:#061923;--cream:#f7ead7;--yellow:#f4bf35;--orange:#ef4a25;--red:#b82b1e;--cyan:#16c5d6;--green:#46c95a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:#06141e;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif}
.stage{position:relative;width:min(100vw,56.31dvh);height:min(100dvh,177.57vw);aspect-ratio:941/1671;overflow:hidden;background:#06141e}
.base{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
.hotspot{position:absolute;z-index:40;border:0;background:transparent;padding:0;cursor:pointer}
.back{left:2.4%;top:2.0%;width:20%;height:5.2%}
.card-hit{transition:filter .15s ease;transform-origin:center bottom}
.card-hit:active{filter:brightness(1.16)}
.card-hit.play-rookie{animation:cardRookie .55s cubic-bezier(.2,.9,.2,1)}
.card-hit.play-skater{animation:cardSkater .65s cubic-bezier(.18,.9,.18,1)}
.card-hit.play-brona{animation:cardBrona .62s cubic-bezier(.15,.9,.2,1)}
.card-hit.play-racer{animation:cardRacer .55s cubic-bezier(.18,.9,.2,1)}
.card-hit.play-chiller{animation:cardChiller .72s ease}
.card-hit.play-dreamer{animation:cardDreamer .72s cubic-bezier(.2,.8,.2,1)}
@keyframes cardRookie{0%,100%{transform:translateY(0)}35%{transform:translateY(-5px) rotate(-1deg) scale(1.02)}65%{transform:translateY(2px) rotate(1deg)}}
@keyframes cardSkater{0%,100%{transform:translateX(0) rotate(0)}30%{transform:translateX(-5px) rotate(-2deg)}60%{transform:translateX(5px) rotate(2deg)}}
@keyframes cardBrona{0%,100%{transform:scale(1)}30%{transform:scale(1.035) rotate(-1deg)}60%{transform:scale(1.015) rotate(1deg)}}
@keyframes cardRacer{0%,100%{transform:translateX(0)}35%{transform:translateX(-7px) skewX(-2deg)}65%{transform:translateX(7px) skewX(2deg)}}
@keyframes cardChiller{0%,100%{transform:translateY(0)}40%{transform:translateY(-5px) rotate(.8deg)}70%{transform:translateY(2px)}}
@keyframes cardDreamer{0%,100%{transform:rotate(0) scale(1)}30%{transform:rotate(2deg) scale(1.03)}60%{transform:rotate(-1.5deg) scale(1.015)}}
.runner-frame{position:absolute;z-index:45;pointer-events:none;border:4px solid var(--yellow);border-radius:18px;box-shadow:0 0 0 2px #fff1a8,0 0 22px 8px rgba(244,191,53,.95),inset 0 0 18px rgba(244,191,53,.24);opacity:0;transition:left .28s cubic-bezier(.2,.9,.2,1),top .28s cubic-bezier(.2,.9,.2,1),width .28s cubic-bezier(.2,.9,.2,1),height .28s cubic-bezier(.2,.9,.2,1),opacity .15s ease}
.runner-frame.show{opacity:1;animation:framePulse 1.1s ease-in-out infinite alternate}
@keyframes framePulse{from{box-shadow:0 0 0 2px #fff1a8,0 0 15px 5px rgba(244,191,53,.65)}to{box-shadow:0 0 0 2px #fff6c5,0 0 28px 10px rgba(244,191,53,1)}}
/* Opaque lower panels: they deliberately cover the baked-in hero art in the background image. */
.hero-panel{position:absolute;z-index:12;left:2.8%;top:35.0%;width:57.0%;height:48.2%;border:4px solid #d9c59e;border-radius:24px;background:radial-gradient(circle at 50% 35%,rgba(26,88,100,.9),transparent 30%),linear-gradient(160deg,#0c3b47 0%,#082832 55%,#061923 100%);box-shadow:0 7px 0 rgba(0,0,0,.30),0 0 0 2px rgba(8,42,53,.65);overflow:hidden;isolation:isolate}
.hero-panel:before{content:"";position:absolute;inset:-40%;z-index:1;pointer-events:none;background:conic-gradient(from 0deg at 50% 50%,transparent 0 10%,rgba(244,191,53,.10) 12%,transparent 16% 38%,rgba(22,197,214,.12) 41%,transparent 47% 70%,rgba(239,74,37,.10) 74%,transparent 80%);animation:spin 10s linear infinite}
.hero-panel:after{content:"";position:absolute;left:8%;right:8%;bottom:5%;height:15%;z-index:2;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.62),transparent 68%);filter:blur(6px);pointer-events:none}
.hero-image{position:absolute;z-index:4;left:50%;top:51%;width:93%;height:92%;object-fit:contain;object-position:center center;transform:translate(-50%,-50%) scale(1);filter:saturate(1.08) contrast(1.05) drop-shadow(0 16px 8px rgba(0,0,0,.42));will-change:transform,opacity,filter}
.hero-image.enter-rookie{animation:heroRookie .78s cubic-bezier(.14,.9,.2,1)}
.hero-image.enter-skater{animation:heroSkater .82s cubic-bezier(.15,.88,.18,1)}
.hero-image.enter-brona{animation:heroBrona .88s cubic-bezier(.14,.92,.18,1)}
.hero-image.enter-racer{animation:heroRacer .68s cubic-bezier(.15,.9,.2,1)}
.hero-image.enter-chiller{animation:heroChiller .95s ease-out}
.hero-image.enter-dreamer{animation:heroDreamer .92s cubic-bezier(.15,.86,.18,1)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes heroRookie{0%{opacity:0;transform:translate(-50%,16%) scale(.80) rotate(-5deg)}35%{opacity:1;transform:translate(-50%,-55%) scale(1.03) rotate(2deg)}70%{transform:translate(-50%,-48%) scale(1.0) rotate(-1deg)}100%{transform:translate(-50%,-50%) scale(1)}}
@keyframes heroSkater{0%{opacity:0;transform:translate(-78%,-48%) scale(.86) rotate(-8deg)}35%{opacity:1;transform:translate(-44%,-50%) scale(1.04) rotate(5deg)}65%{transform:translate(-55%,-50%) scale(1.01) rotate(-2deg)}100%{transform:translate(-50%,-50%) scale(1)}}
@keyframes heroBrona{0%{opacity:0;transform:translate(-50%,-48%) scale(.66) rotate(8deg)}25%{opacity:1;transform:translate(-50%,-54%) scale(1.15) rotate(-3deg)}55%{transform:translate(-50%,-49%) scale(1.02) rotate(1deg)}100%{transform:translate(-50%,-50%) scale(1)}}
@keyframes heroRacer{0%{opacity:0;transform:translate(-82%,-50%) skewX(-8deg) scale(.92)}40%{opacity:1;transform:translate(-44%,-50%) skewX(4deg) scale(1.06)}70%{transform:translate(-54%,-50%) skewX(-2deg) scale(1.02)}100%{transform:translate(-50%,-50%) skewX(0) scale(1)}}
@keyframes heroChiller{0%{opacity:0;transform:translate(-50%,-62%) scale(.9)}42%{opacity:1;transform:translate(-50%,-47%) scale(1.02)}70%{transform:translate(-50%,-52%) scale(1.01) rotate(1deg)}100%{transform:translate(-50%,-50%) scale(1)}}
@keyframes heroDreamer{0%{opacity:0;transform:translate(-50%,-50%) scale(.70) rotate(-8deg)}35%{opacity:1;transform:translate(-50%,-50%) scale(1.08) rotate(3deg)}65%{transform:translate(-50%,-50%) scale(1.02) rotate(-1deg)}100%{transform:translate(-50%,-50%) scale(1)}}
.details{position:absolute;z-index:13;left:60.9%;top:35.0%;width:36.3%;height:48.2%;padding:3.5% 3.2%;border:4px solid #d9c59e;border-radius:24px;background:linear-gradient(135deg,rgba(7,39,50,.99),rgba(5,27,36,.99));box-shadow:0 7px 0 rgba(0,0,0,.30);color:var(--cream);overflow:hidden}
.details h1{margin:0;color:var(--cream);font-family:"Cooper Black","Arial Black",Impact,sans-serif;font-size:clamp(20px,5.1vw,52px);line-height:.86;font-style:italic;font-weight:1000;text-shadow:3px 3px 0 #000;white-space:nowrap}
.tag{margin-top:8px;color:var(--yellow);font-family:"Arial Black",Impact,sans-serif;font-size:clamp(8px,1.65vw,17px);font-weight:1000;letter-spacing:.5px;white-space:nowrap}
.desc{margin:9px 0 10px;font-size:clamp(7px,1.55vw,15px);line-height:1.28;min-height:52px}
.stats{border:3px solid #d9c59e;border-radius:15px;padding:7px 8px 5px}
.stat{display:grid;grid-template-columns:35% 1fr 30px;gap:5px;align-items:center;margin:6px 0;font-size:clamp(7px,1.45vw,14px);font-weight:1000}
.bar{height:9px;background:#263e45;border-radius:8px;overflow:hidden}.fill{height:100%;border-radius:8px;transition:width .38s cubic-bezier(.2,.9,.2,1)}.speed{background:#ef4a25}.jump{background:#f4bf35}.coin{background:#16c5d6}.energy{background:#46c95a}
.special{display:flex;align-items:center;gap:8px;margin-top:9px}.badge{width:38px;height:38px;flex:none;border-radius:50%;border:3px solid var(--yellow);background:var(--red);display:grid;place-items:center;font-size:18px}.special small{display:block;color:var(--yellow);font-size:clamp(6px,1.15vw,11px);font-weight:1000}.special strong{display:block;font-size:clamp(10px,2vw,20px);line-height:1}.special span{display:block;font-size:clamp(6px,1.12vw,11px);line-height:1.18;margin-top:3px}
.lets{position:absolute;z-index:30;left:65.0%;top:72.5%;width:28.0%;height:7.0%;border:0;background:transparent;cursor:pointer}
.hero-spark{position:absolute;z-index:20;left:0;right:0;top:0;bottom:0;pointer-events:none;opacity:0}.hero-spark.play{animation:spark .7s ease-out}.hero-spark i{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--yellow);box-shadow:0 0 12px var(--yellow)}.hero-spark i:nth-child(1){left:18%;top:35%}.hero-spark i:nth-child(2){left:30%;top:55%}.hero-spark i:nth-child(3){left:73%;top:28%}.hero-spark i:nth-child(4){left:83%;top:55%}.hero-spark i:nth-child(5){left:52%;top:17%}
@keyframes spark{0%{opacity:1;transform:scale(.5)}70%{opacity:.8;transform:scale(1.2)}100%{opacity:0;transform:scale(1.8)}}
.tap-note{position:absolute;z-index:50;left:5%;right:5%;top:32.8%;text-align:center;color:var(--cream);font-size:clamp(7px,1.35vw,13px);font-weight:900;pointer-events:none;opacity:0;text-shadow:2px 2px 0 #071722}.tap-note.show{animation:note .95s ease}
@keyframes note{0%{opacity:0;transform:translateY(-3px)}20%,75%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-5px)}}
.footer-tip{position:absolute;z-index:20;left:3.4%;bottom:2.2%;width:30%;height:9%;pointer-events:none}.footer-step{position:absolute;z-index:20;left:38%;bottom:2.4%;width:28%;height:8%;pointer-events:none}.footer-story{position:absolute;z-index:20;right:3%;bottom:2.4%;width:25%;height:9%;pointer-events:none}
@media (max-aspect-ratio: 9/16){.stage{width:100vw;height:177.57vw;max-height:100dvh}.base{object-fit:fill}.hero-panel{top:35.2%;height:47.8%}.details{top:35.2%;height:47.8%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <img class="base" src="assets/screen03-base.png" alt="BARAMEEL RUN runner selection">
  <button class="hotspot back" id="backBtn" aria-label="Back"></button>

  <!-- Runner cards: image/name are already part of the approved artwork; no duplicate labels are added. -->
  <button class="hotspot card-hit" data-key="rookie" style="left:1.9%;top:20.5%;width:14.8%;height:13.4%" aria-label="The Rookie"></button>
  <button class="hotspot card-hit" data-key="skater" style="left:17.4%;top:20.5%;width:14.8%;height:13.4%" aria-label="The Skater"></button>
  <button class="hotspot card-hit" data-key="brona" style="left:32.9%;top:20.5%;width:14.8%;height:13.4%" aria-label="Brona"></button>
  <button class="hotspot card-hit" data-key="racer" style="left:48.5%;top:20.5%;width:14.8%;height:13.4%" aria-label="The Racer"></button>
  <button class="hotspot card-hit" data-key="chiller" style="left:64.0%;top:20.5%;width:14.8%;height:13.4%" aria-label="The Chiller"></button>
  <button class="hotspot card-hit" data-key="dreamer" style="left:79.5%;top:20.5%;width:14.8%;height:13.4%" aria-label="The Dreamer"></button>

  <div class="runner-frame" id="runnerFrame"></div>
  <div class="tap-note" id="tapNote"></div>

  <section class="hero-panel" id="heroPanel" aria-label="Selected runner artwork">
    <img class="hero-image" id="heroImage" src="assets/hero-brona.svg" alt="Selected runner artwork">
    <div class="hero-spark" id="spark"><i></i><i></i><i></i><i></i><i></i></div>
  </section>

  <section class="details" id="details">
    <h1 id="name">BRONA</h1>
    <div class="tag" id="tag">VIBES LEAD THE WAY</div>
    <div class="desc" id="desc">Fast, stylish, and always positive. Built around collecting more.</div>
    <div class="stats">
      <div class="stat"><span>SPEED</span><div class="bar"><div id="speed" class="fill speed" style="width:100%"></div></div><b id="speedN">5/5</b></div>
      <div class="stat"><span>JUMP</span><div class="bar"><div id="jump" class="fill jump" style="width:100%"></div></div><b id="jumpN">5/5</b></div>
      <div class="stat"><span>COIN BOOST</span><div class="bar"><div id="coin" class="fill coin" style="width:100%"></div></div><b id="coinN">5/5</b></div>
      <div class="stat"><span>ENERGY</span><div class="bar"><div id="energy" class="fill energy" style="width:100%"></div></div><b id="energyN">5/5</b></div>
    </div>
    <div class="special"><div class="badge">★</div><div><small>SPECIAL ABILITY</small><strong id="special">MAGNET MOOD</strong><span id="effect">Attracts more marks for a longer time.</span></div></div>
  </section>
  <button class="lets" id="letsBtn" aria-label="Let's run"></button>
  <div class="footer-tip"></div><div class="footer-step"></div><div class="footer-story"></div>
</div>
<script>
const runners={
 rookie:{name:'THE ROOKIE',tag:'THE FRESH START',desc:'Balanced and easy to learn. A dependable choice for your first run.',speed:2,jump:2,coin:3,energy:5,special:'LUCKY START',effect:'Starts each run with a short bonus to collected marks.',note:'Fresh start • steady balance',sound:[392,523,659],hero:'assets/hero-rookie.svg'},
 skater:{name:'THE SKATER',tag:'THE FLOW MASTER',desc:'Built for movement. Great at jumps and keeping momentum.',speed:4,jump:5,coin:3,energy:4,special:'TRICK BOOST',effect:'Gets a short speed burst after a clean trick.',note:'Flow on • jump higher • move faster',sound:[330,494,659,784],hero:'assets/hero-skater.svg'},
 brona:{name:'BRONA',tag:'VIBES LEAD THE WAY',desc:'Fast, stylish, and always positive. Built around collecting more.',speed:5,jump:5,coin:5,energy:5,special:'MAGNET MOOD',effect:'Attracts more marks for a longer time.',note:'Good vibes • more marks • more mood',sound:[523,659,784,1047],hero:'assets/hero-brona.svg'},
 racer:{name:'THE RACER',tag:'THE SPEED MACHINE',desc:'Pure speed. Designed for players who want to push the pace.',speed:5,jump:4,coin:2,energy:3,special:'TURBO RUSH',effect:'Activates a short burst of extra running speed.',note:'Full speed • push the pace',sound:[262,392,523,784],hero:'assets/hero-racer.svg'},
 chiller:{name:'THE CHILLER',tag:'THE COOL RUN',desc:'Steady, relaxed and efficient. Strong energy management for longer runs.',speed:3,jump:2,coin:4,energy:5,special:'CHILL CHARGE',effect:'Recovers energy faster after a clean stretch.',note:'Easy vibes • stay in the run',sound:[261,329,392],hero:'assets/hero-chiller.svg'},
 dreamer:{name:'THE DREAMER',tag:'THE EXPLORER',desc:'Curious and reward-focused. Made for discovering more along the route.',speed:4,jump:3,coin:5,energy:4,special:'DISCOVERY BOOST',effect:'Gets extra marks from newly discovered route spots.',note:'Explore more • discover more',sound:[440,554,659,880],hero:'assets/hero-dreamer.svg'}
};
const stage=document.getElementById('stage');
const cards=[...document.querySelectorAll('.card-hit')];
const frame=document.getElementById('runnerFrame');
const heroImage=document.getElementById('heroImage');
const heroPanel=document.getElementById('heroPanel');
const spark=document.getElementById('spark');
const note=document.getElementById('tapNote');
let active='brona';
function playSound(freqs){
 try{
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  const ctx=window._barameelAudio||(window._barameelAudio=new C());if(ctx.state==='suspended')ctx.resume();
  const now=ctx.currentTime;
  freqs.forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type=i%2?'triangle':'square';o.frequency.setValueAtTime(f,now+i*.065);g.gain.setValueAtTime(.0001,now+i*.065);g.gain.exponentialRampToValueAtTime(.055,now+i*.065+.018);g.gain.exponentialRampToValueAtTime(.0001,now+i*.065+.16);o.connect(g);g.connect(ctx.destination);o.start(now+i*.065);o.stop(now+i*.065+.18)});
 }catch(e){}
}
function placeFrame(el){
 const s=stage.getBoundingClientRect(),r=el.getBoundingClientRect();
 frame.style.left=((r.left-s.left)/s.width*100)+'%';frame.style.top=((r.top-s.top)/s.height*100)+'%';frame.style.width=(r.width/s.width*100)+'%';frame.style.height=(r.height/s.height*100)+'%';frame.classList.add('show');
}
function setText(key){
 const r=runners[key];
 ['name','tag','desc','special','effect'].forEach(id=>document.getElementById(id).textContent=r[id]);
 ['speed','jump','coin','energy'].forEach(k=>{document.getElementById(k).style.width=(r[k]*20)+'%';document.getElementById(k+'N').textContent=r[k]+'/5'});
 document.title='BARAMEEL RUN — '+r.name;
}
function selectRunner(key,el){
 active=key;
 cards.forEach(c=>{c.className='hotspot card-hit';});
 el.classList.add('play-'+key);
 placeFrame(el);
 setText(key);
 note.textContent=runners[key].note;note.className='tap-note show';
 spark.className='hero-spark play';void spark.offsetWidth;spark.className='hero-spark play';
 heroImage.className='hero-image';heroImage.src=runners[key].hero;heroImage.alt=runners[key].name+' hero artwork';
 void heroImage.offsetWidth;heroImage.className='hero-image enter-'+key;
 playSound(runners[key].sound);
 setTimeout(()=>note.className='tap-note',950);
}
cards.forEach(c=>c.addEventListener('click',()=>selectRunner(c.dataset.key,c)));
window.addEventListener('resize',()=>{const c=cards.find(x=>x.dataset.key===active);if(c)placeFrame(c)});
selectRunner('brona',cards.find(c=>c.dataset.key==='brona'));
document.getElementById('backBtn').addEventListener('click',()=>{location.href='./index.html'});
document.getElementById('letsBtn').addEventListener('click',()=>{localStorage.setItem('barameelSelectedRunner',active);location.href='./screen04-run.html'});
</script>
</body>
</html>

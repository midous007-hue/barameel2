button{font:inherit;border:0;cursor:pointer}
#back{
  position:absolute;z-index:40;left:2.7%;top:1.7%;width:14.8%;height:6.6%;
  background:transparent;color:transparent;border-radius:18px;
}
#cardsLayer{
  position:absolute;z-index:30;left:1.5%;right:1.5%;top:15.9%;height:20.9%;
  display:grid;grid-template-columns:repeat(6,1fr);gap:1.0%;
  align-items:stretch;padding:0.4% 0.2%;
}
.runner-card{
  position:relative;min-width:0;background:#0a2b36;border-radius:3.4%/5%;
  overflow:hidden;outline:2px solid rgba(241,213,155,.9);
  box-shadow:0 0 0 2px rgba(4,24,33,.8), inset 0 0 0 1px rgba(255,238,186,.5);
  transform:translateZ(0);transition:transform .22s ease,filter .22s ease,box-shadow .22s ease;
}
.runner-card img{width:100%;height:100%;display:block;object-fit:cover}
.runner-card:active{transform:scale(.97)}
.runner-card.selected{
  outline:3px solid #ffd34e;
  box-shadow:0 0 8px 2px #ffd34e,0 0 20px 5px rgba(255,176,25,.58),inset 0 0 0 2px #fff0a8;
  animation:cardPulse .8s ease-out;
}
@keyframes cardPulse{0%{transform:scale(1)}35%{transform:scale(1.035)}100%{transform:scale(1)}}

/* dynamic lower area */
#stage{
  position:absolute;z-index:20;left:2.6%;top:38.5%;width:57.2%;height:58.0%;
  border-radius:4% 4% 3.5% 3.5%;overflow:hidden;
  background:
    radial-gradient(circle at 50% 45%,rgba(21,72,82,.75),rgba(4,28,38,.98) 68%),
    #06232e;
  border:2px solid rgba(241,216,165,.9);
  box-shadow:inset 0 0 25px rgba(0,0,0,.55),0 0 0 2px rgba(2,18,25,.7);
}
#stage::before{
  content:"";position:absolute;inset:0;opacity:.25;pointer-events:none;
  background:repeating-linear-gradient(115deg,transparent 0 18px,rgba(255,208,68,.16) 19px 22px,transparent 23px 48px);
  transform:translateX(-20%);animation:scan 5s linear infinite;
}
@keyframes scan{to{transform:translateX(30%)}}
#heroGlow{
  position:absolute;left:14%;right:14%;top:15%;bottom:7%;border-radius:50%;
  background:radial-gradient(circle,rgba(255,190,42,.28),rgba(255,70,20,.10) 35%,transparent 70%);
  filter:blur(10px);animation:glow 2.5s ease-in-out infinite alternate;
}
@keyframes glow{to{transform:scale(1.09);opacity:.72}}
#heroArt{
  position:absolute;z-index:6;left:7%;top:2%;width:86%;height:96%;
  object-fit:contain;object-position:center bottom;
  filter:drop-shadow(0 20px 12px rgba(0,0,0,.55));
  transform-origin:50% 78%;
  user-select:none;pointer-events:none;
}
#motionRing,#motionRing2{
  position:absolute;z-index:4;left:13%;top:20%;width:74%;height:58%;border:5px solid rgba(255,201,48,.55);
  border-radius:50%;transform:rotate(-14deg);filter:blur(.2px);
  animation:spin 7s linear infinite;
}
#motionRing2{left:21%;top:27%;width:58%;height:45%;border-color:rgba(32,198,225,.38);animation-direction:reverse;animation-duration:5s}
@keyframes spin{to{transform:rotate(346deg)}}
.spark{position:absolute;z-index:8;width:9px;height:9px;border-radius:50%;background:#ffd33f;box-shadow:0 0 14px #ffd33f;animation:float 2.2s ease-in-out infinite}
.s1{left:13%;top:22%}.s2{right:13%;top:35%;animation-delay:.4s}.s3{left:19%;bottom:20%;animation-delay:.8s}.s4{right:20%;bottom:25%;animation-delay:1.1s}
@keyframes float{50%{transform:translate(9px,-17px) scale(1.5);opacity:.55}}
#heroTag{
  position:absolute;z-index:12;left:5%;bottom:4.5%;padding:.55em .8em;border-radius:999px;
  background:rgba(3,24,32,.78);border:1px solid rgba(255,220,130,.7);color:#ffe9a8;
  font-weight:900;letter-spacing:.08em;font-size:clamp(8px,1.8vw,14px);
}

/* motion states */
.motion-rookie #heroArt{animation:rookie .9s cubic-bezier(.2,.9,.2,1)}
.motion-skater #heroArt{animation:skater .95s cubic-bezier(.2,.9,.2,1)}
.motion-brona #heroArt{animation:brona 1.05s cubic-bezier(.2,.9,.2,1)}
.motion-racer #heroArt{animation:racer .9s cubic-bezier(.2,.9,.2,1)}
.motion-chiller #heroArt{animation:chiller 1.15s cubic-bezier(.2,.9,.2,1)}
.motion-dreamer #heroArt{animation:dreamer 1.0s cubic-bezier(.2,.9,.2,1)}
@keyframes rookie{0%{transform:translateY(18px) scale(.92) rotate(-2deg);opacity:.25}35%{transform:translateY(-8px) scale(1.03) rotate(2deg)}70%{transform:translateY(3px) scale(.99) rotate(-1deg)}100%{transform:none;opacity:1}}
@keyframes skater{0%{transform:translateX(-80px) rotate(-8deg) scale(.94);opacity:.2}45%{transform:translateX(12px) rotate(5deg) scale(1.02)}70%{transform:translateX(-5px) rotate(-2deg)}100%{transform:none;opacity:1}}
@keyframes brona{0%{transform:translateY(28px) rotate(-5deg) scale(.9);opacity:.1}25%{transform:translateY(-10px) rotate(3deg) scale(1.05)}50%{transform:translateY(5px) rotate(-2deg) scale(1)}72%{transform:translateY(-3px) rotate(1deg)}100%{transform:none;opacity:1}}
@keyframes racer{0%{transform:translateX(65px) rotate(7deg) scale(.9);opacity:.15}30%{transform:translateX(-12px) rotate(-5deg) scale(1.05)}60%{transform:translateX(5px) rotate(2deg)}100%{transform:none;opacity:1}}
@keyframes chiller{0%{transform:translateY(22px) scale(.94);opacity:.2}40%{transform:translateY(-7px) scale(1.03)}70%{transform:translateY(3px) scale(.99)}100%{transform:none;opacity:1}}
@keyframes dreamer{0%{transform:translateX(-18px) translateY(15px) rotate(-7deg) scale(.9);opacity:.15}35%{transform:translateX(9px) rotate(5deg) scale(1.04)}65%{transform:translateX(-4px) rotate(-2deg)}100%{transform:none;opacity:1}}

/* information panel */
#info{
  position:absolute;z-index:22;right:2.5%;top:38.5%;width:36.8%;height:58%;
  border-radius:4%;overflow:hidden;background:rgba(4,34,44,.97);
  border:2px solid rgba(241,216,165,.92);box-shadow:inset 0 0 24px rgba(0,0,0,.38);
  color:#fff6df;padding:4.4% 5%;
}
#name{font-family:Impact,"Arial Black",sans-serif;font-style:italic;font-size:clamp(18px,4.8vw,42px);line-height:.92;letter-spacing:.02em;text-transform:uppercase;margin:0;color:#fff4dc;text-shadow:3px 3px 0 #081a22}
#tagline{margin-top:2.5%;color:#ffc62f;font-family:Impact,"Arial Black",sans-serif;font-size:clamp(9px,2vw,16px);letter-spacing:.03em}
#bio{font-size:clamp(8px,1.75vw,13px);line-height:1.35;margin:4% 0 5%;color:#fff3df}
.traits{border:2px solid rgba(241,216,165,.9);border-radius:5%;padding:4.5% 5% 4%;display:grid;gap:4%}
.trait{display:grid;grid-template-columns:29% 1fr 16%;align-items:center;gap:3%;font-weight:900;font-size:clamp(7px,1.6vw,12px)}
.bar{height:9px;border-radius:999px;background:#1a3942;overflow:hidden;box-shadow:inset 0 1px 2px #06141b}
.fill{height:100%;width:0;border-radius:999px;transition:width .55s cubic-bezier(.2,.9,.2,1)}
.speed{background:#ff4d31}.jump{background:#ffc43b}.coin{background:#1ec6d6}.energy{background:#50d96d}
#ability{margin-top:5%;padding:4%;border-radius:6%;background:rgba(1,20,28,.62);border:1px solid rgba(255,217,110,.35)}
#ability small{color:#ffc62f;font-weight:900;font-size:clamp(7px,1.4vw,10px)}
#ability strong{display:block;color:#fff5df;font-family:Impact,"Arial Black",sans-serif;font-size:clamp(12px,2.5vw,20px);margin-top:2%}
#ability p{margin:2% 0 0;font-size:clamp(7px,1.45vw,10px);line-height:1.25}
#run{
  position:absolute;z-index:35;right:3.8%;bottom:8.1%;width:34.5%;height:9.2%;
  background:transparent;color:transparent;border-radius:999px;
}
#tip{display:none}
#toast{
  position:absolute;z-index:60;left:50%;top:42%;transform:translate(-50%,-50%) scale(.9);
  padding:10px 16px;border-radius:999px;background:#071d27;color:#ffe49b;border:1px solid #f5c74d;
  font-weight:900;opacity:0;pointer-events:none;transition:.25s ease;white-space:nowrap;
}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
@media(max-width:420px){
  #info{padding:4% 4.5%}
  #bio{margin:3% 0 4%}
  .traits{padding:4%}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
}
</style>
</head>
<body>
<div id="screen">
  <button id="back" aria-label="Back"></button>

  <div id="cardsLayer"></div>

  <section id="stage">
    <div id="heroGlow"></div>
    <div id="motionRing"></div><div id="motionRing2"></div>
    <span class="spark s1"></span><span class="spark s2"></span><span class="spark s3"></span><span class="spark s4"></span>
    <img id="heroArt" alt="">
    <div id="heroTag"></div>
  </section>

  <section id="info">
    <h1 id="name"></h1>
    <div id="tagline"></div>
    <div id="bio"></div>
    <div class="traits">
      <div class="trait"><span>SPEED</span><div class="bar"><div id="speed" class="fill speed"></div></div><b id="speedVal"></b></div>
      <div class="trait"><span>JUMP</span><div class="bar"><div id="jump" class="fill jump"></div></div><b id="jumpVal"></b></div>
      <div class="trait"><span>COIN BOOST</span><div class="bar"><div id="coin" class="fill coin"></div></div><b id="coinVal"></b></div>
      <div class="trait"><span>ENERGY</span><div class="bar"><div id="energy" class="fill energy"></div></div><b id="energyVal"></b></div>
    </div>
    <div id="ability"><small>SPECIAL ABILITY</small><strong id="abilityName"></strong><p id="abilityText"></p></div>
  </section>

  <button id="run" aria-label="Let's Run"></button>
  <div id="toast"></div>
</div>

};
const order=["rookie","skater","brona","racer","chiller","dreamer"];
let current="brona";
const cardsLayer=document.getElementById("cardsLayer");
const heroArt=document.getElementById("heroArt");
const screen=document.getElementById("screen");
const audioCtx=window.AudioContext?new AudioContext():null;

function makeSound(key){
 if(!audioCtx)return;
 if(audioCtx.state==="suspended")audioCtx.resume();
 const patterns={
  rookie:[330,440],skater:[440,660,880],brona:[392,523,784],racer:[220,440,880],chiller:[262,330],dreamer:[523,659,988]
 };
 const now=audioCtx.currentTime;
 patterns[key].forEach((f,i)=>{
   const o=audioCtx.createOscillator(),g=audioCtx.createGain();
   o.type=key==="racer"?"sawtooth":"triangle";o.frequency.value=f;
   g.gain.setValueAtTime(.0001,now+i*.07);g.gain.exponentialRampToValueAtTime(.06,now+i*.07+.02);g.gain.exponentialRampToValueAtTime(.0001,now+i*.07+.16);
   o.connect(g).connect(audioCtx.destination);o.start(now+i*.07);o.stop(now+i*.07+.18);
 });
}
function renderCards(){
 cardsLayer.innerHTML="";
 order.forEach(key=>{
   const d=DATA[key];
   const b=document.createElement("button");
   b.className="runner-card"+(key===current?" selected":"");
   b.type="button";b.dataset.key=key; b.setAttribute("aria-label",d.name);
   const img=document.createElement("img");img.src=d.img;img.alt=d.name;
   b.appendChild(img); b.onclick=()=>select(key,true);
   cardsLayer.appendChild(b);
 });
}
function select(key,sound){
 current=key; const d=DATA[key];
 renderCards();
 heroArt.src=d.img; heroArt.alt=d.name;
 screen.className="";
 void screen.offsetWidth;
 screen.classList.add("motion-"+d.motion);
 document.getElementById("name").textContent=d.name;
 document.getElementById("tagline").textContent=d.tag;
 document.getElementById("bio").textContent=d.bio;
 const ids=["speed","jump","coin","energy"], vals=["speedVal","jumpVal","coinVal","energyVal"];
 d.stats.forEach((v,i)=>{document.getElementById(ids[i]).style.width=(v*20)+"%";document.getElementById(vals[i]).textContent=v+"/5"});
 document.getElementById("abilityName").textContent=d.ability;
 document.getElementById("abilityText").textContent=d.abilityText;
 document.getElementById("heroTag").textContent=d.name;
 if(sound){
   makeSound(key);
   const t=document.getElementById("toast");t.textContent=d.name+" selected";t.classList.add("show");
   clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove("show"),700);
 }
}
document.getElementById("back").onclick=()=>history.back();
document.getElementById("run").onclick=()=>{
  try{localStorage.setItem("barameelRunner",current)}catch(e){}
  window.location.href="./screen04-run.html";
};
renderCards();select("brona",false);
</script>

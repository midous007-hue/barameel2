<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b2633">
<title>BARAMEEL RUN</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#0b2633;overflow:hidden}
body{font-family:Arial,Helvetica,sans-serif;touch-action:manipulation}
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b2633}
.art{position:relative;width:min(100vw,56.25vh);height:min(100vh,177.7778vw);aspect-ratio:9/16;background:#0b2633 url("./assets/screen01-approved.png") center/100% 100% no-repeat;overflow:hidden}
.hotspot{position:absolute;border:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}
#start{left:8%;right:8%;top:76%;height:10.5%}#how{left:27%;right:27%;top:87%;height:7%}
.modal{position:absolute;inset:0;background:rgba(3,15,21,.76);display:flex;align-items:flex-end;justify-content:center;padding:0 5% 3%;opacity:0;pointer-events:none;transition:.18s ease}
.modal.open{opacity:1;pointer-events:auto}
.card{width:100%;background:#f7e6c6;border-radius:26px 26px 0 0;padding:34px 30px 28px;color:#0b2633;box-shadow:0 -12px 30px rgba(0,0,0,.25)}
.card h1{margin:0 0 24px;font-size:clamp(28px,7vw,42px);line-height:1;font-weight:900}
.card p{margin:0 0 18px;font-size:clamp(18px,4.5vw,25px);line-height:1.45}
.card strong{display:block;font-size:clamp(20px,5vw,28px);margin:6px 0 28px}
.back{width:100%;height:62px;border:0;border-radius:40px;background:#ee3d2f;color:#fff;font-size:24px;font-weight:900;cursor:pointer}
</style>
</head>
<body>
<main class="stage"><section class="art" aria-label="BARAMEEL RUN Screen 01">
<button id="start" class="hotspot" aria-label="Start your run"></button>
<button id="how" class="hotspot" aria-label="How it works"></button>
<div id="howModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="howTitle">
<div class="card"><h1 id="howTitle">HOW IT WORKS?</h1>
<p>Walk and explore the route, collect marks, and discover BARAMEEL along the way.</p>
<strong>10 marks = 1 EGP</strong><button id="back" class="back">BACK</button></div></div>
</section></main>
<script>
const modal=document.getElementById('howModal');
document.getElementById('how').onclick=()=>modal.classList.add('open');
document.getElementById('back').onclick=()=>modal.classList.remove('open');
modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};
document.getElementById('start').onclick=()=>location.href='./screen02.html';
</script>
</body></html>

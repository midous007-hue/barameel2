<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0E2A3D">
<meta name="description" content="BARAMEEL RUN — Screen 01">
<title>BARAMEEL RUN</title>
<style>
:root{--teal:#0E2A3D;--mustard:#F0C830;--orange:#C2571A;--cream:#F5E9DC}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:var(--teal);overflow:hidden}
body{font-family:Arial,Helvetica,sans-serif;touch-action:manipulation}
#app{position:fixed;inset:0;background:var(--teal);display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage{position:relative;width:min(100vw,calc(100dvh * .5628));height:min(100dvh,calc(100vw * 1.7768));aspect-ratio:941/1672;overflow:hidden;background:var(--teal)}
.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;user-select:none;-webkit-user-drag:none}
.hit{position:absolute;border:0;background:transparent;padding:0;cursor:pointer}
.menu{top:1.8%;right:5.5%;width:13%;height:6%}
.start{left:11%;right:11%;top:80.9%;height:8.8%;border-radius:999px}
.how{left:31%;width:38%;top:91%;height:4.3%}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:flash .32s ease-out}
@keyframes flash{0%{opacity:.28}100%{opacity:0}}
.toast{position:absolute;left:10%;right:10%;bottom:12%;padding:14px 18px;text-align:center;background:var(--teal);color:var(--cream);border:3px solid var(--mustard);border-radius:999px;font-weight:800;letter-spacing:.05em;opacity:0;transform:translateY(15px);pointer-events:none;transition:.22s}
.toast.show{opacity:1;transform:none}
.sheet-back{position:absolute;inset:0;background:rgba(14,42,61,.56);opacity:0;pointer-events:none;transition:.2s}
.sheet-back.open{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:4%;right:4%;bottom:3%;padding:22px 20px;background:rgba(245,233,220,.98);border:4px solid var(--mustard);border-radius:24px;color:var(--teal);transform:translateY(120%);transition:.28s cubic-bezier(.2,.8,.2,1);box-shadow:0 20px 60px rgba(0,0,0,.45)}
.sheet.open{transform:translateY(0)}
.sheet h2{font-size:22px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.04em}
.sheet p{font-size:15px;line-height:1.45;margin:7px 0}
.close{float:right;border:0;background:var(--teal);color:var(--cream);width:38px;height:38px;border-radius:50%;font-size:20px}
</style>
</head>
<body>
<main id="app" aria-label="BARAMEEL RUN">
<section class="stage">
<img class="art" src="assets/screen01-approved.png" alt="BARAMEEL RUN Screen 01">
<button class="hit menu" id="menuBtn" aria-label="Open menu"></button>
<button class="hit start" id="startBtn" aria-label="Start your run"></button>
<button class="hit how" id="howBtn" aria-label="How it works"></button>
<div class="flash" id="flash"></div>
<div class="toast" id="toast">RUN READY — LET'S GO</div>
<div class="sheet-back" id="backdrop"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true">
<button class="close" id="closeBtn" aria-label="Close">×</button>
<h2>How it works</h2>
<p><strong>01 — WALK & EXPLORE</strong><br>Move through the BARAMEEL RUN world.</p>
<p><strong>02 — COLLECT MARKS</strong><br>Collect marks as you complete the run.</p>
<p><strong>03 — GOOD FOOD AHEAD</strong><br>Use your marks in the BARAMEEL reward journey.</p>
</section>
</section>
</main>
<script>
const start=document.getElementById('startBtn'),how=document.getElementById('howBtn'),menu=document.getElementById('menuBtn');
const sheet=document.getElementById('sheet'),backdrop=document.getElementById('backdrop'),close=document.getElementById('closeBtn'),flash=document.getElementById('flash'),toast=document.getElementById('toast');
function openSheet(){sheet.classList.add('open');backdrop.classList.add('open')}
function closeSheet(){sheet.classList.remove('open');backdrop.classList.remove('open')}
function startRun(){flash.classList.remove('go');void flash.offsetWidth;flash.classList.add('go');toast.classList.add('show');window.dispatchEvent(new CustomEvent('barameel:start-run'));setTimeout(()=>toast.classList.remove('show'),1600)}
start.onclick=startRun;how.onclick=openSheet;menu.onclick=openSheet;close.onclick=closeSheet;backdrop.onclick=closeSheet;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
</script>
</body>
</html>
